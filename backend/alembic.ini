# Configuración de Alembic.
#
# La URL de la base NO está escrita acá: sale de `DATABASE_URL` a través de
# `app.core.config`, que es la única fuente (spec `dev-infrastructure`,
# "Configuración por entorno"). Por eso `sqlalchemy.url` queda vacío y es intencional.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url se completa en alembic/env.py desde la configuración de la aplicación.

# Formato de los mensajes del log de Alembic.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S